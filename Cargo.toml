[workspace]
resolver = "2"
# `src-tauri` is a workspace member so `cargo fmt`, `cargo clippy` and
# `cargo test --workspace` cover the app crate too. Building it needs the
# platform WebView development packages (WebKitGTK 4.1 on Linux, §9).
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates
git-engine = { path = "crates/git-engine" }
forge-core = { path = "crates/forge-core" }
perf-harness = { path = "crates/perf-harness" }

# Shared third-party crates. Crate-specific ones (gix, notify, rusqlite,
# reqwest, keyring) are added here when the task that first needs them lands;
# gix is pinned exactly (ADR 0002).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
# `CancellationToken` for cancellable reads (§4 Low-resource operation).
# Already in Cargo.lock through tauri.
tokio-util = "0.7.19"
tracing = "0.1.44"

# Canonical paths without Windows' `\\?\` prefix where the plain form works
# (git_engine::repo::open_repo). Already in Cargo.lock through tauri.
dunce = "1.0.5"

# Platform FFI for killing a spawned process tree (git_engine::process).
# Both versions are already in Cargo.lock through tokio.
libc = "0.2.189"
windows-sys = "0.61.2"

# Tauri shell only (src-tauri). Never depended on by the library crates:
# git-engine and the forge crates stay free of Tauri (§4).
tauri = "2.11.6"
tauri-build = "2.6.3"

# IPC type generation (§4 IPC contract, ADR 0003; pinned per ADR 0005).
# specta 2 and tauri-specta 2 are release candidates whose own docs require an
# exact `=` pin, because an rc bump is allowed to break the API; the three move
# together, so bump them together and re-run `pnpm gen:types`.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# Test-only helpers.
tempfile = "3.27.0"

# CLAUDE.md: no unwrap()/expect() outside tests and main.rs. clippy.toml
# allows them in #[test] fns and #[cfg(test)] modules. main.rs and files
# under tests/ (whose helper fns clippy does not treat as tests) start with
# #![allow(clippy::unwrap_used, clippy::expect_used)].
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
