[package]
name = "app"
description = "Tauri shell: window, commands, events, menus, settings and updater."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "app"

[lib]
# The binary stays a thin wrapper around this library so the startup path can be
# exercised from tests and by the bindings generator (`src/bin/gen-types.rs`).
name = "app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# The single tokio runtime the app runs on is built by git-engine's sizing
# rule (§4 Low-resource operation) and handed to Tauri in `run()`.
git-engine = { workspace = true }
# settings.json (SPEC §4 Data at rest): serde for the file format, tempfile
# for the temporary file each save writes beside it and renames over it.
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `tauri::test` (mock runtime, `get_ipc_response`) drives commands over the real
# IPC bridge without a window. Feature unification keeps this out of the app.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
