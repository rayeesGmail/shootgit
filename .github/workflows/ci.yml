# CI for every pull request, every push to main, and manual runs.
#
# Required status check on main: "CI result". That job depends on every other
# job here, so a new job only has to be added to its `needs:` list and the
# branch ruleset never changes. The per-OS "Test (...)" checks are its inputs.
#
# Rust version: rust-toolchain.toml is the only place it is set. rustup ships
# on every GitHub-hosted image, and `rustup toolchain install` with no argument
# installs exactly what that file pins (channel, profile, components).
#
# Actions are pinned to full commit SHAs with the release tag in a trailing
# comment; bump both together.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's superseded run. Pushes to main and
  # manual runs each get their own group, so every commit on main keeps a
  # complete result.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # corepack must never stop to ask whether it may download the pnpm version
  # pinned in package.json's "packageManager".
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

defaults:
  run:
    # One shell on all three OSes (Git Bash on Windows).
    shell: bash

# Every job needs a literal `name:` (it is the check name), a
# `timeout-minutes:`, and an entry in ci-result's `needs:`.
jobs:
  test:
    # Named from matrix.name, not the runner label, so bumping a runner image
    # does not rename a check.
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Let every OS finish so a platform-only failure shows on its own.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-26
          - name: Windows
            os: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Check formatting
        run: cargo fmt --all --check

      # `src-tauri` is a workspace member, so clippy and `cargo test
      # --workspace` compile the Tauri app and link against the platform
      # WebView. macOS (WKWebView) and Windows (WebView2) ship theirs; Ubuntu
      # needs the WebKitGTK 4.1 development packages (SPEC §9). This is the
      # dependency list from the Tauri 2 Linux prerequisites.
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The frontend is checked on all three OSes in this same job rather than
      # in a separate one: the TS tests have to pass everywhere (CLAUDE.md
      # Testing), a separate job would need its own Node setup and could not
      # hand `packages/ui/dist` to the cargo steps, and adding a job would mean
      # adding a check to "CI result"'s needs.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm through corepack
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Test (frontend)
        run: pnpm test

      # Produces packages/ui/dist, which tauri.conf.json's `frontendDist`
      # points at. A debug build resolves the frontend from `devUrl` and does
      # not need it, but building it here keeps the production path honest and
      # checks the Vite build on every OS.
      - name: Build frontend
        run: pnpm build

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs restore main's cache but never save their own, so short-lived
          # branches do not evict it from the 10 GB repository cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # `packages/ipc-types/bindings.ts` is generated from the Rust command
  # signatures and committed, so the frontend typechecks without a Rust
  # toolchain and IPC changes are visible in review (ADR 0003). This job is the
  # enforcement: regenerate, then fail if the committed copy differs.
  #
  # One OS is enough. The generator writes LF everywhere and `.gitattributes`
  # pins the checkout to LF, and `src-tauri/tests/bindings.rs` re-checks the
  # same thing inside `cargo test` on all three OSes. What this job adds on top
  # is the `pnpm gen:types` script itself — its cargo invocation and the path
  # it resolves — which no Rust test can cover.
  bindings:
    name: IPC bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      # `gen-types` links against the app crate, which links the platform
      # WebView (SPEC §9); on Linux that means WebKitGTK 4.1.
      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No `pnpm build` step: a debug build resolves the frontend from
      # `devUrl`, so `generate_context!` never reads `packages/ui/dist`. If
      # that ever changes, tauri-codegen says so by name and this step fails.
      - name: Regenerate the IPC bindings
        run: pnpm gen:types

      - name: Fail if the committed bindings are stale
        run: |
          # `git diff` is blind to an untracked file, so a bindings.ts that was
          # never committed (or was added to .gitignore) would pass the diff
          # below without anyone noticing. Check it is tracked first.
          git ls-files --error-unmatch packages/ipc-types/bindings.ts >/dev/null
          if git diff --exit-code packages/ipc-types/bindings.ts; then
            exit 0
          fi
          msg="The committed IPC bindings do not match the Rust command"
          msg="$msg signatures. Run 'pnpm gen:types' and commit the result"
          msg="$msg (ADR 0003). The diff above is what is missing."
          echo "::error file=packages/ipc-types/bindings.ts::$msg"
          exit 1

  ci-result:
    name: CI result
    # always(): this job must report even when a needed job failed or the run
    # was cancelled, because a skipped required check counts as passing.
    if: always()
    needs: [test, bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require success from every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required CI job finished as '$result'."
              exit 1
            fi
          done
