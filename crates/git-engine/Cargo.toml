[package]
name = "git-engine"
description = "All local Git logic: status, diff, staging, commit, log, branches, rebase, merge, stash, shelve. Pure library with no Tauri or UI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dunce = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
# SPEC §5 Core models: "serde, shared with TS via specta". The models the app
# sends over IPC (status, repo ids, change kinds) derive both; specta is a
# plain type-description crate, so the engine stays free of Tauri (§4).
serde = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Asserts the JSON shape of the models that cross IPC.
serde_json = { workspace = true }
tempfile = { workspace = true }
# `test-util` pauses the clock, so ordering tests can wait until every task is
# idle instead of sleeping for real (tests/repo_actor.rs).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
