[package]
name = "git-engine"
description = "All local Git logic: status, diff, staging, commit, log, branches, rebase, merge, stash, shelve. Pure library with no Tauri or UI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
# `process` and `time`: child processes with a timeout, only in `src/process.rs`.
tokio = { workspace = true, features = ["process", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
# Tests drive the async API on a current-thread runtime.
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
